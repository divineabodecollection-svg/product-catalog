<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Abode Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --maroon: #5a0a0a;
            --maroon-deep: #3b0606;
            --maroon-mid: #7a1515;
            --gold: #c9a84c;
            --gold-light: #e8d08a;
            --gold-pale: #f5e9c2;
            --cream: #fdf6e3;
            --ivory: #f9f3e1;
            --text-dark: #2b1a0f;
            --text-mid: #5c3d2e;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--cream);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* ── HERO HEADER ── */
        .hero {
            background: linear-gradient(160deg, var(--maroon-deep) 0%, var(--maroon) 50%, #8b1a1a 100%);
            padding: 0;
            position: relative;
            overflow: hidden;
            min-height: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 50% 0%, rgba(201,168,76,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 80% 80%, rgba(201,168,76,0.10) 0%, transparent 60%);
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), #f0d080, var(--gold), transparent);
        }

        .hero-ornament {
            color: var(--gold);
            font-size: 13px;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 12px;
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
            animation: fadeUp 1s ease both;
        }

        .hero-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 5vw, 3.8rem);
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 4px;
            text-align: center;
            line-height: 1.15;
            text-shadow: 0 2px 30px rgba(0,0,0,0.4);
            animation: fadeUp 1s 0.15s ease both;
        }

        .hero-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1rem, 2vw, 1.35rem);
            color: rgba(245,233,194,0.75);
            margin-top: 10px;
            letter-spacing: 2px;
            animation: fadeUp 1s 0.3s ease both;
        }

        .hero-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 18px 0;
            animation: fadeUp 1s 0.4s ease both;
        }

        .hero-divider span {
            display: block;
            height: 1px;
            width: 80px;
            background: linear-gradient(90deg, transparent, var(--gold));
        }
        .hero-divider span:last-child {
            background: linear-gradient(90deg, var(--gold), transparent);
        }

        .hero-diamond { color: var(--gold); font-size: 10px; }

        /* ── CONTACT BAR ── */
        .contact-bar {
            background: var(--ivory);
            border-bottom: 1px solid rgba(201,168,76,0.25);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
            font-size: 14px;
            color: var(--text-mid);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .contact-bar a {
            color: var(--maroon);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .contact-bar a:hover { color: var(--gold); }
        .contact-item { display: flex; align-items: center; gap: 7px; }
        .contact-icon { font-size: 15px; }

        /* ── NAV ── */
        .top-nav {
            background: var(--maroon-deep);
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }

        .top-nav a {
            color: var(--gold-pale);
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 12.5px;
            letter-spacing: 2px;
            padding: 16px 36px;
            display: block;
            transition: all 0.25s ease;
            position: relative;
        }

        .top-nav a::after {
            content: '';
            position: absolute;
            bottom: 0; left: 50%; right: 50%;
            height: 2px;
            background: var(--gold);
            transition: all 0.3s ease;
        }

        .top-nav a:hover { color: var(--gold); }
        .top-nav a:hover::after { left: 20%; right: 20%; }
